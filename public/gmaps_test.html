<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>gmaps test</title></head>
<body>
<div id="map" style="height:400px;width:600px"></div>
<script>
function initMap(){ window.__initMapCalled = true; new google.maps.Map(document.getElementById('map'), {center:{lat:24.774265,lng:46.738586}, zoom:8}); }
window.gm_authFailure = function(){ document.body.setAttribute('data-auth-failure','1'); console.error('GM_AUTH_FAILURE'); };
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCIJH6jbULC8MVaAX2LyxIQEBwWPjjeIF0&callback=initMap"></script>
</body></html>
